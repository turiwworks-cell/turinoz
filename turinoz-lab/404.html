<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Not here · Turinoz / Lab</title>
<script>try { const t = localStorage.getItem('tz-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (_) {}</script>
<style>
:root{color-scheme:dark;--ink:#070708;--fg:#eceae4;--fg-3:#7c7b75;--hair:rgba(236,234,228,.16)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--ink:#F2F1EC;--fg:#151513;--fg-3:#8b8a84;--hair:rgba(21,21,19,.18)}}
:root[data-theme="light"]{color-scheme:light;--ink:#F2F1EC;--fg:#151513;--fg-3:#8b8a84;--hair:rgba(21,21,19,.18)}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding-inline:24px;background:var(--ink);color:var(--fg);font:400 15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
main{display:grid;gap:14px;justify-items:start}
p{margin:0}
.k{font:400 11px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
a{color:inherit;text-decoration:none;border-bottom:1px solid var(--hair)}
a:hover,a:focus-visible{border-color:var(--fg)}
</style>
</head>
<body>
<main>
  <p class="k">Turinoz / Lab · 404</p>
  <p>Nothing lives at this address.</p>
  <p><a href="https://turinoz.co/#experiments">See the experiments on turinoz.co ↗</a></p>
</main>
</body>
</html>
