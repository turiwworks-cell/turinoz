<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Quiet Between Stars · Selected moments</title><style>
@font-face{font-family:Archivo;src:url(../fonts/archivo.woff2);font-weight:100 900;font-stretch:62% 125%;font-display:swap}@font-face{font-family:Mono;src:url(../fonts/jetbrains-mono.woff2);font-display:swap}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#EDF1F4}video{width:100%;height:100%;object-fit:cover}header{position:absolute;top:7%;left:5%;right:5%;display:flex;justify-content:space-between;align-items:center;font:9px Mono,monospace;color:#A9B3BC}header b{font-weight:400;display:flex;align-items:center;gap:8px}header b:before{content:'';width:4px;height:4px;border-radius:50%;background:#FFD405;box-shadow:0 0 8px rgba(255,212,5,.55)}.title{position:absolute;left:5%;bottom:10%;pointer-events:none}.title small{font:8px Mono,monospace;color:#76818B;letter-spacing:.1em;text-transform:uppercase}.title h1{font:500 clamp(25px,4.8vw,56px)/1.02 Archivo,Arial,sans-serif;font-stretch:90%;letter-spacing:-.045em;margin:13px 0 0}.title h1 span{color:rgba(237,241,244,.46)}.timeline{position:absolute;left:5%;right:5%;bottom:5%;height:1px;background:rgba(190,220,255,.12)}.timeline i{display:block;width:100%;height:1px;background:#FFD405;transform-origin:left;transform:scaleX(var(--t,0))}@media(max-width:450px){header{font-size:7px}.title h1{font-size:32px}.title small{font-size:7px}}
</style></head><body><video id="v" src="assets/preview.mp4" poster="assets/idle-poster.webp" muted playsinline loop preload="none" aria-label="Selected moments from the delivered Idle, Entry, Hyperspace and Return renders"></video><header><b>Quiet Between Stars</b><span id="state">Primary Idle</span></header><div class="title"><small>Ambient motion system · Selected moments</small><h1>A place to<br><span>stay awhile.</span></h1></div><div class="timeline" aria-hidden="true"><i></i></div><script>
(()=>{const v=document.querySelector('video'),r=matchMedia('(prefers-reduced-motion:reduce)');let seen=false;function sync(){let covered=false;try{covered=parent!==window&&parent.document.documentElement.classList.contains('study-open')}catch{}if(!seen||document.hidden||r.matches||covered)v.pause();else v.play().catch(()=>{})}new IntersectionObserver(es=>{seen=es[0].isIntersecting;sync()},{threshold:.1}).observe(v);document.addEventListener('visibilitychange',sync);r.addEventListener('change',sync);v.addEventListener('timeupdate',()=>{document.documentElement.style.setProperty('--t',v.currentTime/22);document.querySelector('#state').textContent=v.currentTime<6?'Primary Idle':v.currentTime<11?'Entry':v.currentTime<17?'Hyperspace':'Return'});if(parent!==window){try{new MutationObserver(sync).observe(parent.document.documentElement,{attributes:true,attributeFilter:['class']})}catch{}}})();
</script></body></html>
