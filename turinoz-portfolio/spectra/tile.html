<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectra · tile</title>
<meta name="description" content="Spectra, a colour-guessing game by Turinoz, played by its own cursor inside a portfolio tile.">
<meta name="robots" content="noindex">
<style>
/* The portfolio's own font files (../fonts), so the tile looks the same on every system. */
@font-face{font-family:"Inter";src:url(../fonts/inter.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"JB Mono";src:url(../fonts/jetbrains-mono.woff2) format("woff2");font-weight:100 800;font-style:normal;font-display:swap}
:root{
  --bg:#0b0b0c; --ui:cubic-bezier(.2,.8,.2,1);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --bub:#F2F0EB; --bub-ink:#171716; --bub-ring:rgba(0,0,0,.08);
  color-scheme:dark;
}
/* light page: the caption flips to dark so it still reads on the light game */
:root.light{--bub:#1C1C1E; --bub-ink:#F2F0EB; --bub-ring:rgba(255,255,255,.08); color-scheme:light}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:pan-y;outline:none}
body.play canvas{touch-action:none}

/* ---------- the tour cursor: the same one as on the Curve Lab website ---------- */
.tcur{position:absolute;left:0;top:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .6s var(--ui);will-change:transform}
.tcur.on{opacity:1}
.tcur .arrow{position:absolute;left:-5px;top:-3px;width:25px;height:25px;overflow:visible;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35)) drop-shadow(0 5px 9px rgba(0,0,0,.32));transform-origin:5px 3px;transition:transform .22s var(--ui)}
.tcur .arrow path{fill:#fff;stroke:#111;stroke-width:1.25;stroke-linejoin:round}
.tcur.press .arrow{transform:scale(.86)}
.tcur .ring{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12);opacity:0}
.tcur.clk .ring{animation:ring .7s var(--ui)}
@keyframes ring{0%{opacity:.85;transform:scale(.2)}100%{opacity:0;transform:scale(1.25)}}
.tcur .bub{position:absolute;left:20px;top:26px;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:12px;background:var(--bub);color:var(--bub-ink);
  font:500 12.5px/1.25 var(--sans);letter-spacing:-.005em;white-space:nowrap;box-shadow:0 16px 34px -12px rgba(0,0,0,.6),0 0 0 1px var(--bub-ring);
  opacity:0;transform-origin:0 0;transform:translate(var(--bx,0px),var(--by,0px)) scale(var(--bs,.94));transition:opacity .35s var(--ui),transform .6s var(--ui),width .45s var(--ui)}
.tcur .bub.on{opacity:1;--bs:1}
.tcur .bub.out{opacity:0;--bs:.98}
/* who's talking: Turinoz's mark, where the tour shows its step number */
.tcur .bub em{flex:none;width:20px;height:20px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.tcur .bub em svg{display:block;width:100%;height:100%}
.tcur .bub b{display:flex;align-items:center;min-width:0;overflow:hidden;font-weight:500}
.tcur .bub .caret{flex:none;width:1.5px;height:14px;margin-left:2px;border-radius:1px;background:currentColor;opacity:0}
.tcur .bub.typing .caret{opacity:.75;animation:caret .9s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.tcur.up .bub{--by:calc(-100% - 50px)}
@media (max-width:250px){ .tcur .bub em{display:none} .tcur .bub{padding-left:10px;font-size:11.5px} }
@media (prefers-reduced-motion:reduce){ .tcur,.tcur .bub{transition:none} }
</style>
</head>
<body>
<canvas id="c" aria-label="Spectra"></canvas>
<script>
"use strict";
// =============================================================================
// SPECTRA / portfolio tile — the plain-canvas build of the game (mobile/), laid out
// again for a 4:5 tile (a 320 × 400 board, scaled to whatever frame it sits in).
// In the tile, Turinoz's cursor plays it: three colours, then a little play with the
// cards, then the results, and again. "Play yourself" (in the page around it) hands
// the game over; "Watch demo", or 35 s without a touch, gives it back to the cursor.
// It sleeps while off screen, behind a study, or in a hidden tab.
// =============================================================================
(() => {
const W = 320, H = 400, RUN_LENGTH = 3;
const LOOK_SECONDS = 2.1, EXIT_SECONDS = 0.34, IDLE_SECONDS = 35;
const FONT = '"Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

// The board. Everything below is in board units (320 × 400).
const L = {
  rx: 22, rw: 276,
  hero:  { x: 22, y: 64, w: 276, h: 186, r: 22 },     // ready / look
  strip: { x: 22, y: 64, w: 276, h: 72, r: 18 },      // mix: your colour, live
  left:  { x: 22, y: 64, w: 138, h: 116, r: 18 },     // result: the colour you were shown
  right: { x: 160, y: 64, w: 138, h: 116, r: 18 },    // result: yours
  bar: 262, headTitle: 296, headLine: 316,
  rowTop: 148, rowGap: 62, labelOff: 8, trackOff: 18, trackH: 28, inset: 11, capW: 18, capH: 40,
  pairLabel: 198, pairHex: 214, score: 256, rule: 266,
  driftTop: 283, driftGap: 17, driftX0: 100, driftX1: 250,
  button: { cx: 160, cy: 362, h: 38, pad: 24, minW: 276 },
  stack: { top: 58, bottom: 338 },
  sum: { label: 82, score: 126, rule: 138, rows: 150, rowH: 62 },
};
// a kept colour is the phone card (292 × 340) at 64 %
const CARD = { w: 292, h: 340, r: 28 }, CK = 0.64, CW = CARD.w * CK, CH = CARD.h * CK;
const CARDS = { keep: 8, show: 4, dx: 14, dy: 16, fanDx: 18, fanDy: 21, fanRot: 3.5, throw: 60 };
const FEEL = {
  soft: [170, 26], snap: [520, 40], bounce: [620, 26], glide: [900, 60], theme: [110, 21], count: [55, 14.8],
};
const DARK = {
  ground: [11, 11, 12], surface: [22, 22, 24], card: [27, 27, 30],
  ink: [246, 245, 242], muted: [130, 129, 123], faint: [74, 74, 71],
  chip: [255, 255, 255], onchip: [11, 11, 12], shadow: [0, 0, 0],
  ringA: 0.08, shadowA: 0.55, capA: 0.40,
};
const LIGHT = {
  ground: [241, 240, 235], surface: [255, 255, 255], card: [255, 255, 255],
  ink: [19, 19, 18], muted: [119, 118, 110], faint: [186, 185, 178],
  chip: [19, 19, 18], onchip: [255, 255, 255], shadow: [22, 22, 26],
  ringA: 0.08, shadowA: 0.20, capA: 0.22,
};
const COLOURS = [
  ["Crimson", 224, 49, 49], ["Scarlet", 235, 72, 54], ["Coral", 246, 124, 94],
  ["Rust", 176, 78, 36], ["Amber", 240, 168, 40], ["Ochre", 214, 158, 62],
  ["Lemon", 232, 214, 84], ["Sand", 212, 192, 154], ["Olive", 134, 142, 68],
  ["Moss", 104, 138, 62], ["Forest", 46, 108, 76], ["Emerald", 40, 172, 112],
  ["Mint", 122, 202, 166], ["Teal", 28, 150, 152], ["Cyan", 52, 184, 218],
  ["Azure", 58, 134, 236], ["Cobalt", 44, 76, 198], ["Indigo", 78, 68, 178],
  ["Violet", 124, 84, 226], ["Orchid", 172, 100, 198], ["Magenta", 210, 72, 152],
  ["Rose", 238, 106, 140], ["Plum", 112, 62, 96], ["Slate", 96, 110, 124],
];
const VERDICTS = [[0.90, "REMARKABLE"], [0.78, "SHARP"], [0.62, "CLOSE"], [0.42, "ROUGH"], [0, "WIDE"]];
const FAMILIES = [
  [0, "red"], [18, "vermilion"], [38, "orange"], [52, "amber"], [62, "yellow"],
  [80, "chartreuse"], [110, "green"], [150, "jade"], [175, "teal"], [195, "cyan"],
  [215, "azure"], [240, "blue"], [262, "indigo"], [282, "violet"], [305, "magenta"],
  [330, "rose"], [350, "crimson"],
];
const DEG = "°";

// What the cursor says. Lower case, short: it has to fit a small tile.
const SAY = {
  intro: ["two seconds each. watch", "do I still have the eye?", "no hex codes. just eyes"],
  look: ["don't blink", "hold it… hold it…", "got it. I think"],
  last: ["last one", "last one. focus"],
  hue: ["hue first", "hue first. the easy part"],
  richer: ["more colour", "richer than that"],
  softer: ["softer", "a touch greyer"],
  brighter: ["brighter", "lighter. there"],
  darker: ["darker", "deeper. there"],
  cards: ["three for the collection", "my little palette"],
  again: ["one more?", "again"],
  yours: ["your turn 👀", "go on, beat that"],
  back: ["my turn again", "ok, watch this"],
};

// ---- maths -------------------------------------------------------------------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mix = (a, b, t) => a + (b - a) * t;
const round = (v) => Math.floor(v + 0.5);
const mix3 = (a, b, t) => [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)];
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const rand = (a, b) => a + Math.random() * (b - a);
let GA = 1;
const col = (c, a = 1) => `rgba(${round(clamp(c[0], 0, 255))},${round(clamp(c[1], 0, 255))},${round(clamp(c[2], 0, 255))},${clamp(a * GA, 0, 1)})`;

function decode(v) { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }
function lab(c) {
  const r = decode(c[0]), g = decode(c[1]), b = decode(c[2]);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
          1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
          0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
}
function accuracy(a, b) {
  const p = lab(a), q = lab(b);
  const d = Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]);
  return clamp(1 - d / 0.42, 0, 1) ** 0.85;
}
function hsb2rgb(h, s, v) {
  h = ((h % 360) + 360) % 360; s = clamp(s, 0, 100) / 100; v = clamp(v, 0, 100) / 100;
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}
function rgb2hsb(c) {
  const r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d > 0) {
    if (mx === r) h = 60 * ((((g - b) / d) % 6 + 6) % 6);
    else if (mx === g) h = 60 * ((b - r) / d + 2);
    else h = 60 * ((r - g) / d + 4);
  }
  return [((h % 360) + 360) % 360, mx > 0 ? d / mx * 100 : 0, mx * 100];
}
const hex = (c) => "#" + c.map((v) => round(clamp(v, 0, 255)).toString(16).padStart(2, "0")).join("").toUpperCase();
function family(h) {
  h = ((h % 360) + 360) % 360;
  for (let i = FAMILIES.length - 1; i >= 0; i--) if (h >= FAMILIES[i][0]) return FAMILIES[i][1];
  return "red";
}
const minJerk = (t) => t * t * t * (10 - 15 * t + 6 * t * t);

// ---- springs -------------------------------------------------------------------
const springs = [];
const newSpring = (x, p) => ({ x, v: 0, t: x, k: p[0], c: p[1] });
const spring = (x, p) => { const s = newSpring(x, p); springs.push(s); return s; };
function stepSpring(s, dt) {
  if (s.v === 0 && s.x === s.t) return;
  const n = Math.max(1, Math.ceil(dt * 240)), h = dt / n;
  for (let i = 0; i < n; i++) { const a = s.k * (s.t - s.x) - s.c * s.v; s.v += a * h; s.x += s.v * h; }
  if (Math.abs(s.t - s.x) < 0.0005 && Math.abs(s.v) < 0.0005) { s.x = s.t; s.v = 0; }
}
const snap = (s, x) => { s.x = x; s.t = x; s.v = 0; };

function copyText(text) {
  let done = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).catch(fallback); done = true; } } catch (e) {}
  if (!done) fallback();
  function fallback() {
    try {
      const t = document.createElement("textarea");
      t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove();
    } catch (e) {}
  }
}

// ---- canvas ----------------------------------------------------------------------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = canvas.clientWidth || innerWidth, ch = canvas.clientHeight || innerHeight;
  canvas.width = Math.max(1, Math.round(cw * dpr)); canvas.height = Math.max(1, Math.round(ch * dpr));
  scale = Math.min(cw / W, ch / H);
  offX = (cw - W * scale) / 2; offY = (ch - H * scale) / 2;
}

function font(size, weight) { return `${weight || 500} ${size}px ${FONT}`; }
function setSpacing(v) { try { ctx.letterSpacing = (v || 0) + "px"; } catch (e) {} }
function tw(value, size, track, weight) {
  ctx.font = font(size, weight); setSpacing(track);
  const w = ctx.measureText(value).width; setSpacing(0); return w;
}
function txt(value, x, y, size, c, a = 1, align = "left", track = 0, weight = 500) {
  if (a * GA <= 0.004) return;
  ctx.font = font(size, weight); setSpacing(track);
  ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = col(c, a); ctx.fillText(value, x, y); setSpacing(0);
}
// rounded rect with its own radius per corner: [top-left, top-right, bottom-right, bottom-left]
function path4(x, y, w, h, rad) {
  const m = Math.max(0, Math.min(w / 2, h / 2));
  const [tl, tr, br, bl] = rad.map((r) => clamp(r, 0, m));
  ctx.beginPath();
  ctx.moveTo(x + tl, y);
  ctx.lineTo(x + w - tr, y); if (tr) ctx.arcTo(x + w, y, x + w, y + tr, tr);
  ctx.lineTo(x + w, y + h - br); if (br) ctx.arcTo(x + w, y + h, x + w - br, y + h, br);
  ctx.lineTo(x + bl, y + h); if (bl) ctx.arcTo(x, y + h, x, y + h - bl, bl);
  ctx.lineTo(x, y + tl); if (tl) ctx.arcTo(x, y, x + tl, y, tl);
  ctx.closePath();
}
const rr = (x, y, w, h, r) => path4(x, y, w, h, [r, r, r, r]);
function fillRR(x, y, w, h, r, c, a = 1) { rr(x, y, w, h, r); ctx.fillStyle = col(c, a); ctx.fill(); }
function ring(x, y, w, h, r, c, a, width = 1) { rr(x, y, w, h, r); ctx.strokeStyle = col(c, a); ctx.lineWidth = width; ctx.stroke(); }
function rect(x, y, w, h, c, a = 1) { ctx.fillStyle = col(c, a); ctx.fillRect(x, y, w, h); }
function dot(cx, cy, r, c, a = 1) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = col(c, a); ctx.fill(); }

// ---- state -------------------------------------------------------------------------
const S = {
  time: 0, stageTime: 0, stage: "ready", round: 0, played: 0, total: 0, best: 0,
  name: "", verdict: "", target: [128, 128, 128], guess: [128, 128, 128], score: 0,
  theme: "dark", queue: [], gen: 0,
  pointerId: null, pressed: "", pressedArg: 0, hover: "", hoverArg: 0, hoverRow: 0, grab: 0,
  downX: 0, downY: 0, dragging: false, dragDx: 0, dragDy: 0, virtual: false,
  cards: [], drift: null, val: [200, 50, 60], max: [360, 100, 100],
  btnLabel: "", btnPrev: "",
};
S.themeT = spring(0, FEEL.theme);
S.disp = []; S.rowA = []; S.rowHover = []; S.capScale = []; S.driftT = [];
for (let i = 0; i < 3; i++) {
  S.disp.push(spring(S.val[i], FEEL.glide)); S.rowA.push(spring(0, FEEL.soft));
  S.rowHover.push(spring(0, FEEL.soft)); S.capScale.push(spring(1, FEEL.bounce)); S.driftT.push(spring(0, FEEL.snap));
}
S.gIntro = spring(1, FEEL.soft); S.gLook = spring(0, FEEL.soft); S.gResult = spring(0, FEEL.soft);
S.scrim = spring(0, FEEL.soft); S.swapT = spring(0, FEEL.soft); S.lookSwap = spring(0, FEEL.soft);
S.scoreShown = spring(0, FEEL.count); S.fanT = spring(0, FEEL.snap);
// a colour block: position and size spring separately, so the hero can become a strip, then half of a pair
const block = (R, a) => ({
  x: spring(R.x, FEEL.snap), y: spring(R.y, FEEL.snap), w: spring(R.w, FEEL.snap), h: spring(R.h, FEEL.snap), r: spring(R.r, FEEL.snap),
  a: spring(a, FEEL.soft), k: spring(1, FEEL.bounce), seam: spring(0, FEEL.snap),
});
const moveBlock = (B, R) => { B.x.t = R.x; B.y.t = R.y; B.w.t = R.w; B.h.t = R.h; B.r.t = R.r; };
const snapBlock = (B, R) => { snap(B.x, R.x); snap(B.y, R.y); snap(B.w, R.w); snap(B.h, R.h); snap(B.r, R.r); };
S.A = block(L.hero, 1); S.B = block(L.left, 0);
S.btnVis = spring(1, FEEL.soft); S.btnScale = spring(1, FEEL.bounce); S.btnSwap = spring(1, FEEL.soft); S.btnW = spring(0, FEEL.snap);
S.live = [spring(74, FEEL.soft), spring(74, FEEL.soft), spring(71, FEEL.soft)];
S.toast = spring(0, FEEL.soft); S.toastText = ""; S.toastUntil = -1;
S.pal = {};
S.gSummary = spring(0, FEEL.soft);
S.sumRow = [spring(0, FEEL.snap), spring(0, FEEL.snap), spring(0, FEEL.snap)];
S.run = null; S.roundIdx = 0;

// ---- runs ----------------------------------------------------------------------------
function randomPicks() {
  const bag = COLOURS.map((_, i) => i), out = [];
  while (out.length < RUN_LENGTH) out.push(bag.splice(Math.floor(Math.random() * bag.length), 1)[0]);
  return out;
}
function startRun(picks) { S.run = { picks, guesses: [], scores: [] }; S.roundIdx = 0; }
const avgOf = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
function later(delay, fn) { S.queue.push({ t: delay, fn, gen: S.gen }); }
function clearQueue() { S.gen++; S.queue = []; }
const trackTop = (i) => L.rowTop + i * L.rowGap + L.trackOff;
const railX = (i, v) => L.rx + L.inset + v / S.max[i] * (L.rw - L.inset * 2);

function setButton(label, instant) {
  if (label === S.btnLabel && !instant) return;
  if (label !== S.btnLabel) { S.btnPrev = S.btnLabel; S.btnLabel = label; }
  const w = Math.max(tw(label, 14, 0, 600) + L.button.pad * 2, L.button.minW);
  if (instant || S.btnVis.x < 0.05) { snap(S.btnSwap, 1); snap(S.btnW, w); S.btnPrev = ""; }
  else { snap(S.btnSwap, 0); S.btnSwap.t = 1; S.btnW.t = w; }
}
function setTheme(mode, instant) {
  if (mode === S.theme && !instant) return;
  S.theme = mode;
  S.themeT.t = mode === "light" ? 1 : 0;
  if (instant) snap(S.themeT, S.themeT.t);
  document.documentElement.classList.toggle("light", mode === "light");
}

function newRound() {
  clearQueue();
  const fromReady = S.stage === "ready";
  if (!S.run) startRun(randomPicks());
  if (S.roundIdx === 0) S.cards = [];
  const c = COLOURS[S.run.picks[S.roundIdx]];
  S.name = c[0]; S.target = [c[1], c[2], c[3]];
  S.round = S.roundIdx + 1; S.stage = "look"; S.stageTime = 0;
  S.gSummary.t = 0;
  S.val = [200, 50, 60];
  for (let i = 0; i < 3; i++) { snap(S.disp[i], S.val[i]); S.rowA[i].t = 0; }
  const A = S.A;
  A.seam.t = 0;
  if (fromReady) { moveBlock(A, L.hero); S.lookSwap.t = 1; A.k.v -= 1.6; A.a.t = 1; }
  else { snapBlock(A, L.hero); snap(A.seam, 0); snap(A.k, 0.9); A.k.t = 1; snap(A.a, 0); A.a.t = 1; snap(S.lookSwap, 1); }
  S.B.a.t = 0;
  S.gIntro.t = 0; S.gLook.t = 1; S.gResult.t = 0; S.scrim.t = 0; S.btnVis.t = 0;
  snap(S.swapT, 0);
}
function toMix() {
  clearQueue();
  S.stage = "mix"; S.stageTime = 0; S.gLook.t = 0; S.swapT.t = 1;
  moveBlock(S.A, L.strip);
  for (let i = 0; i < 3; i++) later(0.05 + 0.07 * i, () => { S.rowA[i].t = 1; });
  setButton("Lock it");
  later(0.18, () => { S.btnVis.t = 1; });
}
function buildDrift() {

  stopDemo();
  const run = demoRun = { alive: true };
  demo(run, opening).catch((e) => { if (e !== STOP) console.error(e); });
}
function stopDemo() {
  if (demoRun) { demoRun.alive = false; demoRun = null; }
  if (cur) { cur.quiet(); if (S.pointerId === "demo") inUp(cur.x, cur.y, "demo", true, true, false); }
}

// ---- who's playing ----------------------------------------------------------------------
const RM = matchMedia("(prefers-reduced-motion: reduce)");
let MODE = "demo", lastInput = 0, handRun = null;
function tellParent(msg) { if (parent !== window) try { parent.postMessage(Object.assign({ spectra: 1 }, msg), "*"); } catch (_) {} }
// reduced motion: no tour; a finished round stands still instead
function stillFrame() {
  stopDemo(); if (cur) cur.hide();
  resetToReady();
  newRound(); toMix();
  const t = rgb2hsb(S.target); S.val = [round(clamp(t[0] + 4, 0, 360)), round(clamp(t[1] - 3, 0, 100)), round(clamp(t[2] + 2, 0, 100))];
  toResult(); S.btnVis.t = 1;
  for (let i = 0; i < 300; i++) advance(1 / 60);
}
function setMode(mode, tell) {
  if (mode === MODE && !tell) return;
  MODE = mode; lastInput = clock;
  document.body.classList.toggle("play", mode === "play");
  canvas.style.cursor = "";
  if (handRun) { handRun.alive = false; handRun = null; }
  if (mode === "play") {
    stopDemo();
    resetToReady();
    if (cur && cur.live && !RM.matches) {          // he hands it over, then leaves
      cur.live = false;                             // from here on, only your pointer plays
      const run = handRun = { alive: true };
      (async () => { await cur.glide(W * 0.78, H * 0.62, run, 0.6); await cur.say(pick(SAY.yours), run, 0.6); cur.hide(); })().catch(() => {});
    } else if (cur) cur.hide();
  } else {
    release(); S.hover = ""; S.hoverRow = 0;
    if (RM.matches) stillFrame(); else startDemo(pick(SAY.back));
  }
  if (tell) tellParent({ mode });
}

// real pointers count only while the visitor is playing
function toLocal(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left - offX) / scale, (e.clientY - r.top - offY) / scale];
}
function pointerStyle() {
  const h = S.hover;
  canvas.style.cursor = S.grab || S.dragging ? "grabbing" : h === "rail" || h === "card" ? "grab" : h === "action" || h === "copy" || h === "back" ? "pointer" : "";
}
canvas.addEventListener("pointerdown", (e) => {
  if (MODE !== "play" || S.pointerId === "demo") return;
  lastInput = clock;
  if (handRun) { handRun.alive = false; handRun = null; cur.hide(); }
  const [x, y] = toLocal(e);
  if (!inDown(x, y, e.pointerId)) return;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  pointerStyle(); e.preventDefault();
});
canvas.addEventListener("pointermove", (e) => {
  if (MODE !== "play" || S.pointerId === "demo") return;
  if (S.pointerId === null && e.pointerType !== "mouse") return;
  lastInput = clock;
  const [x, y] = toLocal(e);
  inMove(x, y, e.pointerId); pointerStyle();
});
function up(e, cancelled) {
  if (MODE !== "play" || S.pointerId !== e.pointerId) return;
  const [x, y] = toLocal(e);
  inUp(x, y, e.pointerId, cancelled, false, e.pointerType === "mouse");
  pointerStyle();
}
canvas.addEventListener("pointerup", (e) => up(e, false));
canvas.addEventListener("pointercancel", (e) => up(e, true));
canvas.addEventListener("pointerleave", (e) => { if (MODE === "play" && S.pointerId === null) { S.hover = ""; S.hoverRow = 0; pointerStyle(); } });

addEventListener("message", (e) => {
  if (e.source !== parent || !e.data || !e.data.spectra) return;
  if (e.data.mode === "play" || e.data.mode === "demo") setMode(e.data.mode);
});

// ---- theme: the page around it decides; on its own, the system does ----------------------
const mqDark = matchMedia("(prefers-color-scheme: dark)");
function wantedTheme() {
  let t = "";
  try { if (parent !== window) t = parent.document.documentElement.dataset.theme || ""; } catch (_) {}
  return t === "light" || t === "dark" ? t : mqDark.matches ? "dark" : "light";
}
function follow(instant) { const m = wantedTheme(); if (m !== S.theme || instant) setTheme(m, instant); }

// ---- the clock: runs only while the tile is on screen and the page is in front -------------
let seen = true, raf = 0, last = 0;
const asleep = () => {
  if (document.hidden || !seen) return true;
  try { return parent !== window && parent.document.documentElement.classList.contains("study-open"); } catch (_) { return false; }
};
function frame(now) {
  raf = 0;
  if (asleep()) { last = 0; return; }
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  clock += dt;
  tickTimers();
  advance(dt);
  draw();
  if (MODE === "play" && clock - lastInput > IDLE_SECONDS && S.pointerId === null) setMode("demo", true);
  raf = requestAnimationFrame(frame);
}
const wake = () => { if (!raf && !asleep()) raf = requestAnimationFrame(frame); };
if ("IntersectionObserver" in window) new IntersectionObserver((es) => { seen = es[es.length - 1].isIntersecting; wake(); }).observe(canvas);
document.addEventListener("visibilitychange", wake);
setInterval(wake, 700);                 // picks up again after a study closes
setInterval(() => follow(false), 1000);
mqDark.addEventListener && mqDark.addEventListener("change", () => follow(false));
addEventListener("resize", () => { resize(); if (cur) cur.place(); if (!raf) draw(); });

// ---- boot ------------------------------------------------------------------------------
updatePalette();
resize();
follow(true);
updatePalette();
setButton("Start", true);
draw();
const fontsIn = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('600 14px "Inter"'), document.fonts.load('500 12px "Inter"')]) : Promise.resolve();
Promise.race([fontsIn, new Promise((r) => setTimeout(r, 1500))]).catch(() => {}).then(() => {
  setButton(S.btnLabel || "Start", true);            // measured again in the real font
  cur = new Cursor();
  const q = new URLSearchParams(location.search);
  if (q.has("play")) setMode("play");
  else if (RM.matches) stillFrame();
  else startDemo();
  tellParent({ ready: 1 });
  draw(); wake();
});
})();
</script>
</body>
</html>
