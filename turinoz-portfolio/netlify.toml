# TURINOZ portfolio (turinoz.co) — plain static site, no build step.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Fonts, the Rive runtime and the videos never change name, so cache them for a year.
# (If you replace one of them, give the new file a new name.)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/rive/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The .riv files and pages revalidate on every visit, so a redeploy shows up right away.
[[headers]]
  for = "/rive/*.riv"
  [headers.values]
    Cache-Control = "no-cache"
